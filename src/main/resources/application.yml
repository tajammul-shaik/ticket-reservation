server:
  port: 8777

spring:
  application:
    name: ticket-reservation

  # Loads KEY=value pairs from a local env file as properties. Real environment
  # variables still win; "optional:" means a missing file (e.g. on Render) is skipped.
  config:
    import: optional:file:${ENV_FILE:${user.home}/.config/ticket-reservation/ticket-reservation.env}[.properties]

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ticket_reservation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ticket-reservation-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # How long a request waits for a pooled connection before it is shed as 429.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # A request waiting this long on a seat lock is shed (retried, then 429) instead of
      # holding a pooled connection for MySQL's default 50 s.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
      data-source-properties:
        # Lets JDBC batches (seat inserts on show creation) go to MySQL as multi-row INSERTs.
        rewriteBatchedStatements: true

  jackson:
    # JSON fields are snake_case (price_paise, per_user_limit) as in the BRD.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise only (BR-13): 250.5 must be a 400, not silently truncated.
      accept-float-as-int: false
      fail-on-unknown-properties: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-at-least-32-bytes}
    admin-secret: ${ADMIN_SECRET:local-admin-secret}
    token-ttl: 24h
  admission:
    # NFR-04: requests beyond this many in flight wait up to max-wait for a slot, then get 429.
    max-in-flight: ${ADMISSION_MAX_IN_FLIGHT:200}
    max-wait: ${ADMISSION_MAX_WAIT:5s}

management:
  endpoints:
    web:
      # Prometheus scrape endpoint served at /metrics (FR-07). Health has its own controller.
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    # Text logs (local) show the request id; JSON logs (prod) carry every MDC field.
    correlation: "[%X{request_id:-}] "
