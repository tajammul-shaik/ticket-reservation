# Active when SPRING_PROFILES_ACTIVE=prod. Overrides application.yml.
# Secrets have no defaults here: if one is missing the app fails at startup
# instead of running with a dev value.

server:
  port: ${PORT:8777}
  shutdown: graceful

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Managed free-tier MySQL allows few connections; keep the pool small. Fixed size by
      # default: opening a TLS connection to the managed DB mid-burst is slow.
      minimum-idle: ${DB_POOL_MIN_IDLE:${DB_POOL_MAX_SIZE:10}}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # Fail fast: a request still without a connection after 5 s is shed as 429. The first
      # live burst (pool 5, 30 s wait) queued ~195 requests on the pool and answered in 10-30 s.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    admin-secret: ${ADMIN_SECRET}
  admission:
    # Sized to the small prod pool rather than the local default of 200: about 10 requests in
    # flight per connection. Excess requests wait at the door (cheaply, before JWT parsing) and
    # are shed after ADMISSION_MAX_WAIT instead of queueing on the pool. The first live burst
    # served ~39 reserve/s with 5 connections, so 50 in flight is about 1.3 s of work.
    max-in-flight: ${ADMISSION_MAX_IN_FLIGHT:50}
